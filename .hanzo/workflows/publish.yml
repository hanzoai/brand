name: npm publish

# Publishes @hanzo/brand to npmjs.com whenever the package.json version
# field changes on main. Run-once-per-version: the workflow no-ops if
# the same version is already on the registry.

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for npm provenance

jobs:
  publish:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Skip if already published
        id: check
        run: |
          NAME=$(jq -r .name package.json)
          VER=$(jq -r .version package.json)
          if curl -fsSL "https://registry.npmjs.org/$NAME/$VER" > /dev/null 2>&1; then
            echo "$NAME@$VER already on registry; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # dist/ is gitignored (built, never committed), so the checkout has NO
      # dist/. Without this build the publish tarball ships an EMPTY dist/ — the
      # package resolves as a version but every subpath 404s (this shipped the
      # broken 1.4.0: `Module not found: @hanzo/brand/registry`). Build first.
      - name: Install + build
        if: steps.check.outputs.skip != 'true'
        run: |
          npm ci
          npm run build
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        # --no-provenance: provenance requires the package to already exist on the
        # registry with provenance enabled; a token publish would 422 otherwise.
        run: npm publish --access public --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
